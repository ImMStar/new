services:
  - type: web
    name: terabox-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: RESOLVER_API
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
